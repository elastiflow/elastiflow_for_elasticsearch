name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  mandatory_checks:
    name: Mandatory checks
    uses: elastiflow/gha-reusable/.github/workflows/reusable_mandatory_checks.yml@v0

  all_checks:
    name: All Checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - mandatory_checks
    steps:
      - name: Check if all checks passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJson(needs) }}
